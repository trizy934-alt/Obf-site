[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/auth.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/scripts"
  to = "/.netlify/functions/create-script"
  status = 200
  force = true

[[redirects]]
  from = "/api/scripts/:slug/unlock"
  to = "/.netlify/functions/unlock-script/:slug"
  status = 200
  force = true

[[redirects]]
  from = "/api/my-scripts"
  to = "/.netlify/functions/my-scripts"
  status = 200
  force = true

[[redirects]]
  from = "/api/scripts/:slug"
  to = "/.netlify/functions/delete-script/:slug"
  status = 200
  force = true

[[redirects]]
  from = "/l/:token"
  to = "/.netlify/functions/loader/:token"
  status = 200
  force = true
  
[[redirects]]
  from = "/v/:slug"
  to = "/view.html"
  status = 200
